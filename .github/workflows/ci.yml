name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  flash:
    name: flash edition · test (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the optional PDF dependencies (text + figure cropping)
        run: python -m pip install pypdfium2 pypdf
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run on the bundled sample course
        run: |
          python coach.py setup samples/zh-data-structures --days 1
          python coach.py -w samples/zh-data-structures/exam-cram next
          python coach.py -w samples/zh-data-structures/exam-cram quiz
      - name: Build the skill bundle
        run: python release.py

  full-changed:
    name: full edition · detect changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            full:
              - 'full/**'

  full:
    name: full edition (v4.3) · test (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: full-changed
    if: needs.full-changed.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install audited optional render dependencies
        run: python -m pip install latex2mathml==3.60.0 Pillow==10.4.0
      - name: Run the v4.3 unittest suite
        run: python -m unittest discover -s tests

  bundle:
    name: attach the flash skill bundle to the release
    if: github.event_name == 'release'
    needs: flash
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exam-cram-coach-flash.zip
        run: python release.py dist/exam-cram-coach-flash.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/exam-cram-coach-flash.zip --clobber
